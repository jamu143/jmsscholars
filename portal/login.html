<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student login — JMS Scholars</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/style.css">
<style>
  body { display: flex; align-items: center; justify-content: center; min-height: 100vh; }

  .login-box {
    width: 380px;
    padding: 40px;
    background: var(--paper);
    border: 1px solid var(--line);
    text-align: center;
  }

  .login-logo {
    font-family: 'DM Serif Display', serif;
    font-size: 24px;
    color: var(--navy);
    margin-bottom: 4px;
  }

  .login-logo span { color: var(--gold); }

  .login-tagline {
    font-family: 'DM Mono', monospace;
    font-size: 10px;
    color: var(--charcoal-soft);
    letter-spacing: 0.06em;
    text-transform: uppercase;
    margin-bottom: 32px;
  }

  .login-note {
    font-size: 14px;
    color: var(--charcoal-soft);
    margin-bottom: 24px;
    line-height: 1.6;
  }

  .back-link {
    display: inline-block;
    margin-top: 20px;
    font-size: 13px;
    color: var(--navy);
    text-decoration: none;
    border-bottom: 1px solid var(--line);
  }
</style>
</head>
<body>

  <div class="login-box">
    <div class="login-logo">JMS<span>·</span>Scholars</div>
    <div class="login-tagline">Journey made simple</div>
    <p class="login-note">The student portal — login, materials, and discussion boards — is under construction. This page is a placeholder while we design the sign-in flow together.</p>
    <a href="../index.html" class="back-link">Back to homepage</a>
  </div>

</body>
</html>
